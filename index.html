<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>予約システム</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="menuButton">☰</div>
  <div id="menu" style="display:none;">
  <button onclick="openSettingsModal()">設定</button>
  <button id="adminMenuBtn" onclick="location.href='admin.html'" style="display:none>管理画面</button>
  <button onclick="logout()">ログアウト</button>
</div>

  <h2 id = "title">予約カレンダー</h2>
  
  <div id="legend"></div>
  <div id="calendar"></div>
  <select id="center">
    <option value="gyoda_minami" selected>行田南センター</option>
    <option value="hanasaki">花崎センター</option>
    <option value="kazo">加須センター</option>
  </select>
  <div id="overlay" style="display:none;" onclick="closeModal()">
    <div id="modal" onclick="event.stopPropagation()">
      <p id="selectedTime"></p>
      <select id="resourceSelect"></select>
      <label style="display:block; margin:10px 0;">
        <input type="checkbox" id="allDayCheckbox">
        終日予約
      </label>
      <input type="datetime-local" id="startInput">
      <input type="datetime-local" id="endInput">
      <label>タイトル</label>
      <input type="text" id="titleInput" placeholder="例：会議 / 打ち合わせ">
      <label>備考</label>
      <textarea id="noteInput" placeholder="自由記入"></textarea>
      <button onclick="submitForm()">予約確定</button>
      <button onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <div id="settingsModal" onclick="event.stopPropagation()"
    style="display:none; background:white;
    padding:20px; position:fixed; top:30%; left:50%;
    transform:translate(-50%,-30%); z-index:10000;">
      
    <h3>設定</h3>
    <h4>ユーザー名変更</h4>
    <input id="newUsername" placeholder="新しい名前">
    <button onclick="updateUsername()">変更</button>
      
     <h4>パスワード変更</h4>
    <input id="oldPassword" type="password" placeholder="現在のパスワード">
    <input id="newPassword" type="password" placeholder="新しいパスワード">
    <button onclick="updatePassword()">変更</button>
      
    <br><br>
    <button onclick="closeSettingsModal()">閉じる</button>
  </div>
  
  <div id="detailModal" style="display:none;" onclick="closeDetailModal()">
    <div id="detailContent" onclick="event.stopPropagation()"
      style="background:white; padding:20px; width:300px; margin:100px auto;">
      <p id="detailTitle"></p>
      <p id="detailTime"></p>
      <p id="detailNote"></p>
      <button onclick="editFromDetail()">編集</button>
      <button onclick="deleteFromDetail()">削除</button>
      <button onclick="closeDetailModal()">閉じる</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <script src="app.js"></script>

  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>

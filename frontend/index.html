<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>予約システム</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h2>予約システム</h2>

  <select id="resourceSelect"></select>

  <button onclick="logout()">ログアウト</button>
</div>

<h3>手入力予約</h3>

<input type="date" id="date">
<input type="time" id="startTime">
<input type="time" id="endTime">

<label>
  <input type="checkbox" id="allDay"> 終日
</label>

<button onclick="submitForm()">予約する</button>
  
<div id="calendar" style="height:700px;"></div>

<script src="app.js"></script>

<div id="confirmBox" class="modal">
  <div class="modal-content">

    <p id="confirmText"></p>

    <button onclick="confirmOk(event)">OK</button>
    <button onclick="confirmCancel()">キャンセル</button>

  </div>
</div>


</body>
</html>
